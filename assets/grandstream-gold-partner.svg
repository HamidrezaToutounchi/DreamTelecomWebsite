<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 110" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="25%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FFFBEB" />
      <stop offset="75%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F" />
      <stop offset="100%" stop-color="#003366" />
    </linearGradient>
    <linearGradient id="gsBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0072CE" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Gold Shield / Badge Container -->
  <rect x="3" y="5" width="354" height="100" rx="16" fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="3" filter="url(#dropShadow)"/>
  <rect x="8" y="10" width="344" height="90" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-opacity="0.45"/>

  <!-- Left Gold Medallion Seal -->
  <g transform="translate(54, 55)">
    <!-- Outer Seal Starburst -->
    <circle r="36" fill="url(#goldGrad)" />
    <circle r="31" fill="#0A192F" />
    <circle r="28" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3 2" />
    
    <!-- Grandstream Signal Waves Inside Seal -->
    <path d="M-12 -6 C-5 -14, 5 -14, 12 -6" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M-8 0 C-3 -6, 3 -6, 8 0" stroke="#0072CE" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="0" cy="5" r="3" fill="url(#goldGrad)" />

    <!-- Bottom Ribbon / Stars -->
    <polygon points="0,12 2,16 6,16 3,19 4,23 0,20 -4,23 -3,19 -6,16 -2,16" fill="url(#goldGrad)" />
    <polygon points="-12,14 -10.8,16.5 -8,16.5 -10,18.2 -9.2,21 -12,19.2 -14.8,21 -14,18.2 -16,16.5 -13.2,16.5" fill="url(#goldGrad)" />
    <polygon points="12,14 13.2,16.5 16,16.5 14,18.2 14.8,21 12,19.2 9.2,21 10,18.2 8,16.5 10.8,16.5" fill="url(#goldGrad)" />
  </g>

  <!-- Vertical Divider -->
  <line x1="104" y1="22" x2="104" y2="88" stroke="url(#goldGrad)" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- Right Typography -->
  <text x="120" y="36" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="18" letter-spacing="1.5">GRANDSTREAM</text>
  <rect x="120" y="44" width="215" height="22" rx="4" fill="url(#goldGrad)"/>
  <text x="227" y="59" fill="#0A192F" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="12.5" letter-spacing="2" text-anchor="middle">GOLD PARTNER</text>
  <text x="120" y="83" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="10.5" letter-spacing="1.2">YETKİLİ KURUMSAL ÇÖZÜM ORTAĞI</text>
</svg>
